# GPL training configuration for Wolfpack (10x10 grid, 3 wolves, 2 stags)

# --- Environment ---
env:
  id: "wolfpack"
  grid_size: 10
  n_wolves: 3
  n_prey: 2
  max_steps: 50
  sight: 10
  coop_radius: 1
  min_coop_wolves: 2
  capture_reward: 5.0
  respawn_prey: true

# --- PREPROCESS dimensions ---
# x_j = (y, x) = 2 features per wolf
# u   = (y, x, active) * 2 prey = 6 features
# B_j = [x_j ; u] -> obs_dim = 8
preprocess:
  agent_feat_dim: 2
  prey_feat_dim: 3
  obs_dim: 8

# --- GPL architecture ---
model:
  action_dim: 5
  hidden_dim: 100
  type_dim: 100
  n_gnn_layers: 2
  pairwise_rank: 5

# --- Training ---
training:
  mode: "online"
  n_episodes: 128000
  n_envs: 16
  lr: 2.5e-4
  gamma: 0.99
  t_update: 4
  t_targ_update: 1
  polyak_tau: 1.0e-3
  grad_clip: 10.0

# --- Epsilon schedule ---
epsilon:
  init: 1.0
  final: 0.05
  decay_steps: 4800000
  decay_episodes: 1500

# --- Evaluation ---
eval:
  eval_every: 50
  eval_episodes: 5
  save_every: 50

# --- Logging ---
logging:
  tensorboard: true
  log_dir: "runs/gpl_wolfpack"
  results_dir: "results/gpl_wolfpack"

seed: 42
